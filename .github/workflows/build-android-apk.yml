name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: burr-exchange-upload
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: burr-exchange-upload/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Repair empty icon files
        run: |
          cd android/app/src/main/res
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#FFFFFF</color></resources>' > values/ic_launcher_background.xml
          for f in $(find . -type f -name '*.png' -size 0); do
            case "$f" in
              *foreground*) cp mipmap-hdpi/ic_launcher_foreground.png "$f" ;;
              *) cp mipmap-xxxhdpi/ic_launcher.png "$f" ;;
            esac
          done

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: burr-exchange-android-debug-apk
          path: burr-exchange-upload/android/app/build/outputs/apk/debug/app-debug.apk
